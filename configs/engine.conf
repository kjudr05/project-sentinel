# sentinel engine.conf
# ─────────────────────
# Runtime configuration for the C++ hardware engine.
# Edit this file to tune thresholds without recompiling.
# All values are re-read on SIGHUP (kill -HUP <pid>).
#
# Samsung-specific profiles can be pushed via Knox MDM by
# replacing this file through a managed app config channel.

[polling]
interval_ms         = 500       # How often to sample hardware (ms)
warmup_samples      = 2         # Silent samples before writing (CPU delta stabilisation)
console_every       = 4         # Print to stdout every N samples

[thresholds]
ram_warn_pct        = 75.0      # RAM % that triggers WARN state
ram_critical_pct    = 90.0      # RAM % that triggers CRITICAL state
thermal_warn_c      = 70.0      # CPU temp (°C) for WARN
thermal_critical_c  = 85.0      # CPU temp (°C) for CRITICAL
battery_low_pct     = 20.0      # Battery % on discharge for BATTERY_LOW
battery_critical_pct= 10.0      # Battery % on discharge for BATTERY_CRITICAL
disk_critical_pct   = 95.0      # Disk usage % for DISK_CRITICAL
cpu_saturated_pct   = 95.0      # CPU % for CPU_SATURATED flag

[forecast]
window_size         = 10        # Rolling window (samples) for trend analysis
horizon_samples     = 6         # How far ahead to forecast (× poll_interval)

[log]
path                = ../logs/sentinel_redo.log
rotate_mb           = 10        # Rotate log when it exceeds this size (MB)
keep_rotated        = 3         # Number of rotated logs to keep

[device]
# Override auto-detection for Samsung-specific deployments
# Leave blank for auto-detect
profile             =           # galaxy_s24 | galaxy_book | galaxy_tab | auto
soc_vendor          =           # exynos | snapdragon | auto
