<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ironGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="100%" stop-color="#1a4a7a"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d2a00"/>
      <stop offset="100%" stop-color="#5a3d00"/>
    </linearGradient>
    <linearGradient id="soulGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a1a"/>
      <stop offset="100%" stop-color="#1e4a1e"/>
    </linearGradient>
    <linearGradient id="clawGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a1a4a"/>
      <stop offset="100%" stop-color="#4a1a5f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700" letter-spacing="1">
    🛡️ Project Sentinel — Architecture
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#8b949e" font-size="11">
    Hardware-Aware Adaptive AI · Samsung PRISM AX Hackathon
  </text>

  <!-- ── Layer 1: THE IRON ───────────────────────────────────────── -->
  <rect x="30" y="80" width="195" height="360" rx="10" fill="url(#ironGrad)" stroke="#2d6db5" stroke-width="1.5"/>
  <text x="127" y="104" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1">THE IRON</text>
  <text x="127" y="120" text-anchor="middle" fill="#60a5fa" font-size="10">Hardware Engine</text>

  <!-- C++ box -->
  <rect x="48" y="132" width="159" height="52" rx="7" fill="#0d1f3c" stroke="#3b82f6" stroke-width="1"/>
  <text x="127" y="152" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">C++ Engine</text>
  <text x="127" y="166" text-anchor="middle" fill="#8b949e" font-size="9">sentinel_engine.cpp</text>
  <text x="127" y="178" text-anchor="middle" fill="#8b949e" font-size="9">Win32 / sysfs APIs</text>

  <!-- Python box -->
  <rect x="48" y="196" width="159" height="52" rx="7" fill="#0d1f3c" stroke="#3b82f6" stroke-width="1"/>
  <text x="127" y="216" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Python Engine</text>
  <text x="127" y="230" text-anchor="middle" fill="#8b949e" font-size="9">sentinel_engine_py.py</text>
  <text x="127" y="242" text-anchor="middle" fill="#8b949e" font-size="9">psutil · cross-platform</text>

  <!-- Samsung box -->
  <rect x="48" y="260" width="159" height="52" rx="7" fill="#0d1f3c" stroke="#3b82f6" stroke-width="1"/>
  <text x="127" y="280" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Samsung Metrics</text>
  <text x="127" y="294" text-anchor="middle" fill="#8b949e" font-size="9">Exynos thermal zones</text>
  <text x="127" y="306" text-anchor="middle" fill="#8b949e" font-size="9">Knox · NPU · GPU</text>

  <!-- Metrics list -->
  <text x="127" y="336" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600">Polls every 500ms</text>
  <text x="127" y="350" text-anchor="middle" fill="#8b949e" font-size="9">RAM · CPU · Thermal</text>
  <text x="127" y="363" text-anchor="middle" fill="#8b949e" font-size="9">Battery · Disk · NPU</text>
  <text x="127" y="376" text-anchor="middle" fill="#8b949e" font-size="9">LSN-stamped entries</text>
  <text x="127" y="410" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="600">0.017% CPU overhead</text>

  <!-- ── Redo Log (middle connector) ────────────────────────────── -->
  <rect x="243" y="190" width="100" height="160" rx="8" fill="#1c1a10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="293" y="218" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">REDO LOG</text>
  <text x="293" y="234" text-anchor="middle" fill="#d97706" font-size="9">sentinel_redo.log</text>
  <rect x="256" y="248" width="74" height="36" rx="4" fill="#0d0d00" stroke="#78350f" stroke-width="1"/>
  <text x="293" y="262" text-anchor="middle" fill="#fbbf24" font-size="8.5" font-weight="600">LSN:1000042</text>
  <text x="293" y="273" text-anchor="middle" fill="#8b949e" font-size="7.5">RAM:67% CPU:34%</text>
  <text x="293" y="283" text-anchor="middle" fill="#8b949e" font-size="7.5">TEMP:62°C WARN</text>
  <text x="293" y="308" text-anchor="middle" fill="#d97706" font-size="9">Atomic append</text>
  <text x="293" y="322" text-anchor="middle" fill="#d97706" font-size="9">Crash-safe IPC</text>
  <text x="293" y="336" text-anchor="middle" fill="#d97706" font-size="9">Human-readable</text>

  <!-- ── Layer 2: THE BRIDGE ────────────────────────────────────── -->
  <rect x="361" y="80" width="195" height="360" rx="10" fill="url(#bridgeGrad)" stroke="#b45309" stroke-width="1.5"/>
  <text x="458" y="104" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700" letter-spacing="1">THE BRIDGE</text>
  <text x="458" y="120" text-anchor="middle" fill="#fbbf24" font-size="10">Analysis Layer</text>

  <!-- Bridge boxes -->
  <rect x="376" y="132" width="165" height="52" rx="7" fill="#1c1200" stroke="#d97706" stroke-width="1"/>
  <text x="458" y="152" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Context Analyser</text>
  <text x="458" y="166" text-anchor="middle" fill="#8b949e" font-size="9">Rolling window (10 samples)</text>
  <text x="458" y="178" text-anchor="middle" fill="#8b949e" font-size="9">Linear regression forecast</text>

  <rect x="376" y="196" width="165" height="52" rx="7" fill="#1c1200" stroke="#d97706" stroke-width="1"/>
  <text x="458" y="216" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Anomaly Detector</text>
  <text x="458" y="230" text-anchor="middle" fill="#8b949e" font-size="9">8 failure patterns</text>
  <text x="458" y="242" text-anchor="middle" fill="#8b949e" font-size="9">Z-score · variance ratio</text>

  <rect x="376" y="260" width="165" height="52" rx="7" fill="#1c1200" stroke="#d97706" stroke-width="1"/>
  <text x="458" y="280" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Session Memory</text>
  <text x="458" y="294" text-anchor="middle" fill="#8b949e" font-size="9">Hardware event log</text>
  <text x="458" y="306" text-anchor="middle" fill="#8b949e" font-size="9">Cross-turn history</text>

  <!-- Mode output -->
  <text x="458" y="336" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Output per turn:</text>
  <text x="458" y="350" text-anchor="middle" fill="#22c55e" font-size="9">● FULL  ◑ QUANTIZED</text>
  <text x="458" y="363" text-anchor="middle" fill="#ef4444" font-size="9">○ MINIMAL  ⊘ SUSPEND</text>
  <text x="458" y="376" text-anchor="middle" fill="#8b949e" font-size="9">+ token budget (256–1024)</text>
  <text x="458" y="410" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="600">30s horizon forecast</text>

  <!-- ── Layer 3: THE SOUL / OpenClaw ───────────────────────────── -->
  <rect x="574" y="80" width="195" height="200" rx="10" fill="url(#clawGrad)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="671" y="104" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1">OPENCLAW</text>
  <text x="671" y="120" text-anchor="middle" fill="#a78bfa" font-size="10">Agent + Skill Layer</text>

  <rect x="589" y="132" width="165" height="42" rx="7" fill="#1a0d2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="671" y="150" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">SOUL.md + AGENTS.md</text>
  <text x="671" y="164" text-anchor="middle" fill="#8b949e" font-size="9">Adaptive mode personality</text>

  <rect x="589" y="186" width="165" height="42" rx="7" fill="#1a0d2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="671" y="204" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">sentinel-hardware SKILL</text>
  <text x="671" y="218" text-anchor="middle" fill="#8b949e" font-size="9">before_turn injection hook</text>

  <rect x="589" y="240" width="165" height="30" rx="7" fill="#1a0d2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="671" y="260" text-anchor="middle" fill="#a78bfa" font-size="9">HEARTBEAT.md (60s monitor)</text>

  <!-- Claude API -->
  <rect x="574" y="300" width="195" height="140" rx="10" fill="url(#soulGrad)" stroke="#15803d" stroke-width="1.5"/>
  <text x="671" y="324" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700" letter-spacing="1">CLAUDE API</text>
  <text x="671" y="340" text-anchor="middle" fill="#4ade80" font-size="10">claude-sonnet-4-6</text>
  <rect x="589" y="352" width="165" height="52" rx="7" fill="#0d1f0d" stroke="#15803d" stroke-width="1"/>
  <text x="671" y="371" text-anchor="middle" fill="#86efac" font-size="9">System prompt injected</text>
  <text x="671" y="384" text-anchor="middle" fill="#8b949e" font-size="9">Hardware context block</text>
  <text x="671" y="397" text-anchor="middle" fill="#8b949e" font-size="9">+ anomaly events + memory</text>
  <text x="671" y="420" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">max_tokens = token budget</text>

  <!-- ── Arrows ─────────────────────────────────────────────────── -->
  <!-- Iron → Log -->
  <line x1="225" y1="270" x2="241" y2="270" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Log → Bridge -->
  <line x1="343" y1="270" x2="359" y2="270" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Bridge → OpenClaw -->
  <line x1="556" y1="210" x2="572" y2="210" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- OpenClaw → Claude -->
  <line x1="671" y1="280" x2="671" y2="298" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Bottom: Dashboard + API ────────────────────────────────── -->
  <rect x="30" y="460" width="840" height="60" rx="8" fill="#111820" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="481" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="600">MONITORING &amp; INTERFACES</text>

  <!-- Web dashboard -->
  <rect x="45" y="490" width="165" height="22" rx="4" fill="#0d1f3c" stroke="#3b82f6" stroke-width="1"/>
  <text x="127" y="505" text-anchor="middle" fill="#93c5fd" font-size="9">🌐 sentinel_web.html (SSE)</text>

  <!-- Terminal dashboard -->
  <rect x="220" y="490" width="165" height="22" rx="4" fill="#1c1200" stroke="#d97706" stroke-width="1"/>
  <text x="302" y="505" text-anchor="middle" fill="#fcd34d" font-size="9">💻 Terminal Dashboard</text>

  <!-- REST API -->
  <rect x="395" y="490" width="165" height="22" rx="4" fill="#1a0d2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="477" y="505" text-anchor="middle" fill="#c4b5fd" font-size="9">🔌 REST API :7474</text>

  <!-- Report -->
  <rect x="570" y="490" width="165" height="22" rx="4" fill="#0d1f0d" stroke="#15803d" stroke-width="1"/>
  <text x="652" y="505" text-anchor="middle" fill="#86efac" font-size="9">📊 HTML Session Report</text>

  <!-- Benchmark -->
  <rect x="745" y="490" width="115" height="22" rx="4" fill="#1c1010" stroke="#ef4444" stroke-width="1"/>
  <text x="802" y="505" text-anchor="middle" fill="#fca5a5" font-size="9">⚡ Benchmark</text>

  <!-- Legend -->
  <text x="450" y="535" text-anchor="middle" fill="#8b949e" font-size="9">
    133 tests · 0.017% CPU overhead · 12,000+ lines/sec · &lt;10ms latency · &lt;4KB heap
  </text>
</svg>
